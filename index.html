<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lichess Clone — Шахматы онлайн</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/dist/esm/chess.js"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-knight">♞</span>
      <span class="brand-name">lichess<span class="brand-dot">.</span>clone</span>
    </div>
    <nav class="topnav">
      <button class="nav-btn" data-mode="menu">Играть</button>
      <button class="nav-btn" data-mode="local">2 игрока</button>
      <button class="nav-btn" data-mode="computer">Против компьютера</button>
    </nav>
  </header>

  <main class="app">
    <!-- ===== Start / menu screen ===== -->
    <section id="menu-screen" class="screen menu-screen">
      <h1 class="menu-title">Играть в шахматы</h1>
      <p class="menu-sub">Выберите режим игры</p>
      <div class="menu-cards">
        <button class="menu-card" data-start="local">
          <span class="card-icon">♟</span>
          <span class="card-title">Локальная игра</span>
          <span class="card-desc">Два игрока за одним экраном</span>
        </button>
        <button class="menu-card" data-start="computer-white">
          <span class="card-icon">♙</span>
          <span class="card-title">Против компьютера</span>
          <span class="card-desc">Играть белыми · Stockfish</span>
        </button>
        <button class="menu-card" data-start="computer-black">
          <span class="card-icon">♚</span>
          <span class="card-title">Против компьютера</span>
          <span class="card-desc">Играть чёрными · Stockfish</span>
        </button>
      </div>
      <div class="menu-difficulty">
        <label for="difficulty">Уровень движка</label>
        <select id="difficulty">
          <option value="1">1 · Новичок</option>
          <option value="2">2 · Лёгкий</option>
          <option value="3" selected>3 · Средний</option>
          <option value="4">4 · Сильный</option>
          <option value="5">5 · Эксперт</option>
        </select>
      </div>
    </section>

    <!-- ===== Game screen ===== -->
    <section id="game-screen" class="screen game-screen hidden">
      <div class="game-layout">
        <!-- Left: board -->
        <div class="board-column">
          <div class="player-bar" id="player-top">
            <div class="player-info">
              <span class="player-avatar">♟</span>
              <span class="player-name">Чёрные</span>
            </div>
            <div class="captured" id="captured-top"></div>
            <div class="material" id="material-top"></div>
          </div>

          <div class="board-wrap">
            <div id="board" class="board"></div>
            <div id="overlay" class="overlay hidden">
              <div class="overlay-box">
                <h2 id="overlay-title">Мат</h2>
                <p id="overlay-sub"></p>
                <div class="overlay-actions">
                  <button class="btn btn-primary" id="overlay-new">Новая игра</button>
                  <button class="btn btn-ghost" id="overlay-menu">В меню</button>
                </div>
              </div>
            </div>
            <div id="thinking" class="thinking hidden">
              <span class="spinner"></span> Компьютер думает…
            </div>
          </div>

          <div class="player-bar" id="player-bottom">
            <div class="player-info">
              <span class="player-avatar">♙</span>
              <span class="player-name">Белые</span>
            </div>
            <div class="captured" id="captured-bottom"></div>
            <div class="material" id="material-bottom"></div>
          </div>
        </div>

        <!-- Right: controls + moves -->
        <aside class="side-panel">
          <div class="status-card">
            <div class="turn-indicator">
              <span class="turn-dot" id="turn-dot"></span>
              <span id="status-text">Ход белых</span>
            </div>
            <div class="mode-label" id="mode-label">Локальная игра</div>
          </div>

          <div class="moves-panel">
            <div class="moves-header">Ходы</div>
            <ol class="moves-list" id="moves-list"></ol>
          </div>

          <div class="controls">
            <button class="ctrl-btn" id="btn-flip" title="Перевернуть доску">
              <span>⇅</span> Перевернуть
            </button>
            <button class="ctrl-btn" id="btn-undo" title="Отменить ход">
              <span>↶</span> Отменить
            </button>
            <button class="ctrl-btn" id="btn-resign" title="Сдаться">
              <span>⚑</span> Сдаться
            </button>
            <button class="ctrl-btn ctrl-primary" id="btn-new" title="Новая игра">
              <span>+</span> Новая игра
            </button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <!-- Promotion dialog -->
  <div id="promo-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Выберите фигуру</h3>
      <div class="promo-choices" id="promo-choices"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
