<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ultimate Chess App</title>
  <!-- Telegram Web Apps SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/dist/esm/chess.js"
      }
    }
  </script>
</head>
<body>
  <div id="sprite-root"></div>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- ================= MENU ================= -->
  <section id="screen-menu" class="screen">
    <header class="app-header">
      <div class="logo">
        <span class="logo-knight"></span>
        <div class="logo-text">
          <strong>Ultimate Chess</strong>
          <small>Telegram Mini App</small>
        </div>
      </div>
    </header>

    <div class="profile-card glass">
      <img id="profile-avatar" class="avatar" alt="" />
      <div class="avatar-fallback" id="profile-avatar-fallback">?</div>
      <div class="profile-meta">
        <div class="profile-name" id="profile-name">Гость</div>
        <div class="profile-sub" id="profile-sub">Telegram Mini App</div>
      </div>
      <div class="profile-rank">
        <span class="rank-badge">♛</span>
        <span id="profile-rank-text">Новичок</span>
      </div>
    </div>

    <div class="mode-select">
      <button class="mode-card glass selected" data-mode="bot">
        <span class="mode-icon">🤖</span>
        <span class="mode-title">Играть с ботом</span>
        <span class="mode-sub" id="menu-bot-sub">Stockfish · ур. 3</span>
      </button>
      <button class="mode-card glass" data-mode="local">
        <span class="mode-icon">👥</span>
        <span class="mode-title">Pass &amp; Play</span>
        <span class="mode-sub">Двое на устройстве</span>
      </button>
    </div>

    <button class="online-btn" id="btn-online">🌍 Играть онлайн</button>

    <button class="start-btn" id="btn-start">Начать игру</button>

    <button class="settings-link glass" id="btn-open-settings">
      <span class="gear">⚙️</span> Настройки
    </button>

    <p class="hint">Режим выбирается карточками выше</p>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="screen-settings" class="screen hidden">
    <header class="app-header">
      <button class="back-inline" id="btn-back-settings">‹</button>
      <div class="logo-text"><strong>Настройки</strong></div>
    </header>

    <div class="settings-list glass">
      <div class="setting-row">
        <div class="setting-label">
          <span>🔊</span> Звуки ходов
        </div>
        <label class="switch">
          <input type="checkbox" id="set-sound" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <span>📳</span> Вибро-отклик
        </div>
        <label class="switch">
          <input type="checkbox" id="set-haptics" checked />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <span>🧠</span> Уровень бота
        </div>
        <div class="level-picker" id="set-level">
          <button data-lvl="1">1</button>
          <button data-lvl="2">2</button>
          <button data-lvl="3" class="active">3</button>
          <button data-lvl="4">4</button>
          <button data-lvl="5">5</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <span>🎨</span> Тема доски
        </div>
        <div class="level-picker" id="set-board-theme">
          <button data-theme="neo" class="active">Neo</button>
          <button data-theme="classic">Классика</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screen-game" class="screen hidden">
    <header class="app-header">
      <button class="back-inline" id="btn-back-game">‹</button>
      <div class="logo-text"><strong id="game-title">Партия</strong></div>
      <button class="icon-btn" id="btn-flip" title="Перевернуть">⇅</button>
    </header>

    <div class="player-strip" id="strip-top">
      <span class="p-dot"></span>
      <span class="p-name" id="name-top">Чёрные</span>
      <span class="p-captured" id="cap-top"></span>
      <span class="p-mat" id="mat-top"></span>
    </div>

    <div class="board-shell glass">
      <div id="board" class="board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces-layer"></div>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <h2 id="overlay-title">Мат</h2>
            <p id="overlay-sub"></p>
            <div class="overlay-actions">
              <button class="btn btn-primary" id="overlay-new">Ещё раз</button>
              <button class="btn btn-ghost" id="overlay-menu">В меню</button>
            </div>
          </div>
        </div>
        <div id="thinking" class="thinking hidden"><span class="spinner"></span> бот думает…</div>
      </div>
    </div>

    <div class="player-strip" id="strip-bottom">
      <span class="p-dot light"></span>
      <span class="p-name" id="name-bottom">Белые</span>
      <span class="p-captured" id="cap-bottom"></span>
      <span class="p-mat" id="mat-bottom"></span>
    </div>

    <div class="game-footer">
      <div class="status-pill glass" id="status-pill">Ход белых</div>
      <div class="footer-btns">
        <button class="icon-btn" id="btn-undo" title="Отменить">↶</button>
        <button class="icon-btn" id="btn-resign" title="Сдаться">⚑</button>
      </div>
    </div>
  </section>

  <!-- Online matchmaking / invite modal -->
  <div id="online-modal" class="modal hidden">
    <div class="modal-box glass online-box">
      <div class="big-spinner" id="online-spinner"></div>
      <h3 id="online-title">Поиск соперника…</h3>
      <p class="online-sub" id="online-sub">Подбираем равного по силе игрока</p>
      <div class="invite-row hidden" id="invite-row">
        <input id="invite-link" readonly />
        <div class="invite-btns">
          <button class="btn btn-ghost" id="invite-copy">Копировать</button>
          <button class="btn btn-ghost" id="invite-share">Отправить</button>
        </div>
      </div>
      <div class="overlay-actions">
        <button class="btn btn-ghost" id="invite-friend">Пригласить друга</button>
        <button class="btn btn-primary" id="online-cancel">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Promotion modal -->
  <div id="promo-modal" class="modal hidden">
    <div class="modal-box glass">
      <h3>Превращение пешки</h3>
      <div class="promo-choices" id="promo-choices"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
